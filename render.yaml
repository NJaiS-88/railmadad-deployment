# ==============================================================================
# RailMadad 2.0 - Render Infrastructure Blueprint
# Use: Render Dashboard -> "New" -> "Blueprint" -> Connect Repository
# ==============================================================================

services:
  # ── 1. Backend REST API Server ──────────────────────────────────────────────
  - type: web
    name: railmadad-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Public URL of the ML service, e.g. https://railmadad-ml-service.onrender.com
      # (free web services can't receive private-network traffic, so the public URL is required)
      - key: ML_SERVICE_URL
        sync: false

  # ── 2. Python Multimodal AI Service (Whisper + BLIP + Vision LLM) ───────────
  - type: web
    name: railmadad-ml-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.ml
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
